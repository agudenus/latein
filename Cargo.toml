[package]
name = "polyarb"
version = "0.1.0"
edition = "2021"
description = "Polymarket arbitrage scanner and (later) trader. Dry-run by default."

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = { version = "1", features = ["serde-with-str"] }
rust_decimal_macros = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
thiserror = "2"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
# M7 dashboard. default-features off keeps the tree to http1 + tokio + json — no TLS
# stack of its own (the page is served on loopback), so the build stays rustls-only.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

# `tower`'s ServiceExt::oneshot drives the router in-process, so the route tests never
# bind a port.
[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
strip = true
