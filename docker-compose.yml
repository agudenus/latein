# polyarb — dry-run soak deployment.
#
#   docker compose up -d --build     start (and build) in the background
#   docker compose logs -f            watch it work
#   docker compose down               stop
#
# Full walkthrough, including the one-time host directory permissions step that this file
# depends on, is in docs/deploy.md.
#
# Safety: `mode` is locked to "dry-run" in config/default.toml and the daemon refuses to
# start otherwise. Nothing here can place an order, and no wallet key exists to sign one.

services:
  polyarb:
    build:
      context: .
      dockerfile: Dockerfile
    image: polyarb:local
    container_name: polyarb

    # The soak is a week long and the point is unattended uptime: come back after a VPS
    # reboot, an OOM kill or a panic. `unless-stopped` (rather than `always`) means a
    # deliberate `docker compose stop` still stays stopped across a reboot.
    restart: unless-stopped

    # Optional Telegram credentials — and nothing else. When TELEGRAM_BOT_TOKEN or
    # TELEGRAM_CHAT_ID is missing or blank, alerts degrade silently to logs/events.jsonl
    # and the daemon carries on. `.env` must exist (copy .env.example); it is gitignored.
    env_file:
      - .env

    # Bind mounts, not named volumes: during a soak you want to `cat reports/summary-*.md`
    # and `tail -f logs/events.jsonl` from the host shell without exec'ing into anything,
    # and you want the data to survive `docker compose down -v`.
    #
    # The container runs as uid 10001, so these three host directories must be owned by
    # 10001 or the daemon dies on startup with "Permission denied". docs/deploy.md step 6.
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./reports:/app/reports
      # Uncomment to tune settings without rebuilding the image. The baked-in copy at
      # /app/config/default.toml is used otherwise.
      # - ./config/default.toml:/app/config/default.toml:ro

    command: ["run"]

    # This is a LIVENESS check, not a correctness check — be clear about what it proves.
    #
    # Since M7.1 the daemon's heartbeat task upserts `runtime_status` every ~5s from a timer
    # of its own, so the SQLite WAL is written whatever the scan loop is doing. So:
    #   healthy   => the process is alive and writing
    #   unhealthy => the process is gone, stopped or cannot write its database
    # It deliberately no longer means "the loop is turning": at live scale a REST sweep takes
    # ~195s and a DNS outage stretched a tick past this window, which marked a working daemon
    # unhealthy. A *wedged* loop is not this check's job either — Compose does not restart an
    # unhealthy container anyway — it is the daemon's own progress watchdog
    # (daemon.watchdog_stall_secs), which exits with code 75 so `restart: unless-stopped`
    # below revives it. The dashboard shows the same stall as "alive but stalled".
    # This check does NOT tell you the Polymarket APIs are answering, or that anything is
    # being detected. For that, read the `errors` count in the daily report and grep the
    # logs — docs/deploy.md, "Reviewing the soak".
    healthcheck:
      test:
        - CMD-SHELL
        - 'newest=$$(ls -t /app/data/polyarb.sqlite* 2>/dev/null | head -1); [ -n "$$newest" ] && [ $$(( $$(date +%s) - $$(stat -c %Y "$$newest") )) -lt 180 ]'
      interval: 60s
      timeout: 10s
      retries: 3
      # A cold start paginates the entire Gamma universe before the first cycle writes
      # anything. Five minutes is slack, not an estimate — being marked unhealthy during
      # startup would trigger a restart loop that never gets far enough to be healthy.
      start_period: 300s

    # SIGTERM is handled: the loop stops and the in-flight lifecycle re-polls are drained
    # before exit. lifecycle.repoll_window_secs is 30, so give it more than that rather
    # than SIGKILLing opportunities into the `unresolved` bucket on every restart.
    stop_grace_period: 45s

    # Without this, an info-level 5-second loop writes an unbounded json-file log and
    # eventually fills a small VPS disk. 10 MB x 5 keeps roughly the last two weeks of
    # scan-cycle lines, which comfortably covers a one-week soak review.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ---------------------------------------------------------------------------------
  # The read-only soak monitor (M7).
  # ---------------------------------------------------------------------------------
  #
  # Same image, different command. A SEPARATE PROCESS from the daemon on purpose: it opens
  # the same SQLite file with SQLITE_OPEN_READ_ONLY (WAL allows a concurrent reader),
  # serves GET routes only, and shares no state with the scanner. It cannot disturb a
  # running soak, and there is nothing on the page to press — the binary has no order
  # path, no wallet and no signing code.
  #
  # It needs the daemon's `runtime_status` row (schema v3), so let `polyarb` come up first.
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: polyarb:local
    container_name: polyarb-dashboard
    restart: unless-stopped

    # Nothing here reads a credential — the dashboard has no alert path and no API client.
    # env_file is omitted deliberately: the fewer processes that see the token, the better.

    # HOME-LAN EXPOSED (owner decision, 2026-08-08): published on all interfaces so the
    # dashboard is reachable from any device on the home network at http://<host-ip>:8080
    # — no SSH tunnel needed. It stays read-only with no controls and no credentials, so
    # the exposure is view-only; anyone on the same network can SEE the soak's evidence.
    #
    # Only do this on a trusted private network (home LAN behind NAT). On a VPS or any
    # host with a public interface, revert to loopback-only and use an SSH tunnel:
    #     - "127.0.0.1:8080:8080"
    #   ssh -L 8080:127.0.0.1:8080 you@your-vps   # then open http://127.0.0.1:8080
    ports:
      - "8080:8080"

    volumes:
      # `:ro` is the belt to the code's braces: the container itself cannot write the
      # database directory even if the process tried. logs/ and reports/ are not mounted
      # at all, because the dashboard reads neither — it reads SQLite and only SQLite.
      #
      # NOTE: SQLite in WAL mode needs to write the -wal and -shm sidecars to open a
      # database for reading, so a read-only mount only works while the daemon (which owns
      # those files) is running and has already created them. That is the normal case
      # here; if the dashboard ever fails to start with "unable to open database file"
      # while `polyarb` is stopped, drop the `:ro` — it is defence in depth, not the
      # mechanism. The mechanism is SQLITE_OPEN_READ_ONLY in the process itself.
      - ./data:/app/data:ro
      # Uncomment together with the daemon's copy above to tune [dashboard] without a
      # rebuild.
      # - ./config/default.toml:/app/config/default.toml:ro

    command: ["dashboard"]

    # `bind` must be reachable from outside the container, so it is overridden here rather
    # than in the file the daemon shares. 0.0.0.0 INSIDE the container is still loopback
    # OUTSIDE it: the port mapping above is what decides who can reach it.
    environment:
      POLYARB_DASHBOARD_BIND: "0.0.0.0:8080"

    # The daemon creates and migrates the database; the dashboard only reads it and exits
    # with a clear message if it is absent. `depends_on` orders the start, and
    # `restart: unless-stopped` covers the case where the daemon is still paginating its
    # first universe when the dashboard first looks.
    depends_on:
      - polyarb

    # Liveness, again — not correctness. It proves the HTTP server is answering; it says
    # nothing about whether the daemon behind the database is still scanning (the page
    # itself says that, loudly, by taking itself over). `bash` rather than CMD-SHELL
    # because /dev/tcp is a bash feature and the image ships no curl.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /api/state HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q " 200 "'
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
