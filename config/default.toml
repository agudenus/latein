# polyarb — Phase A (scanner) configuration.
#
# No secrets in this file. Credentials, when Phase B needs them, come from the
# environment only (see CLAUDE.md, Wallet & Security Rules).
#
# Environment overrides:
#   POLYARB_CONFIG              path to this file
#   POLYARB_GAMMA_BASE_URL      api.gamma_base_url
#   POLYARB_CLOB_BASE_URL       api.clob_base_url
#   POLYARB_PER_TRADE_CAP_USD   risk.per_trade_cap_usd
#   POLYARB_NET_FLOOR_DEFAULT   scan.floors.default.taker
#   POLYARB_MODE                mode
#   POLYARB_DB_PATH             storage.database_path
#   POLYARB_LOG_DIR             storage.log_dir
#   POLYARB_REPORT_DIR          storage.report_dir
#   POLYARB_SCAN_INTERVAL_SECS  daemon.scan_interval_secs
#   POLYARB_ALERT_MIN_NET       alerts.alert_min_net_per_share
#   POLYARB_STREAM_ENABLED      stream.enabled  (true/false)
#   POLYARB_STREAM_URL          stream.url
#   POLYARB_DASHBOARD_BIND      dashboard.bind
#
# Alert credentials are read from the environment only and never appear here:
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID

# Only "dry-run" is implemented. Live execution is a later milestone behind an
# explicit opt-in flag.
mode = "dry-run"

[api]
gamma_base_url = "https://gamma-api.polymarket.com"
clob_base_url = "https://clob.polymarket.com"
request_timeout_secs = 20
# Ceiling on the connect phase alone (DNS + TCP + TLS). request_timeout_secs bounds a
# request that is making progress badly; this one bounds a request that never starts.
# During a live DNS outage the resolver stopped answering and every book batch sat in it,
# stretching one loop tick to minutes — a request that will never connect should give up in
# seconds.
connect_timeout_secs = 10
max_retries = 3
# Client-side throttle between requests to the same host (rate-limit politeness).
min_request_interval_ms = 120
# Token ids per POST /books call.
books_batch_size = 100
user_agent = "polyarb/0.1.0"

[scan]
page_size = 100
# Query parameter that carries the keyset cursor back to /events/keyset.
#
# Discovery paginates /events/keyset (the legacy /events list endpoint is deprecated and
# caps offset depth with an HTTP 422). The endpoint returns a next_cursor, but the
# parameter that actually advances is reported to be after_cursor — passing it back as
# cursor= re-serves the first page for some clients. If a run logs
# "WARN keyset pagination did not advance — universe truncated", this name is the first
# thing to change; "cursor" is the other candidate.
keyset_cursor_param = "after_cursor"
# Hard stop on Gamma events pagination — a rate-limit backstop, NOT the normal
# stopping point (discovery ends when the API runs out of pages). If this cap is
# what stops us the universe is incomplete and a NegRisk event can be split across the
# boundary, so the scanner logs "WARN universe truncated at max_events".
#
# Raised 2000 -> 6000 -> 20000. Each raise followed a live run that filled every page and
# still hit the cap: 6000 events came back as 5940 kept / 44222 markets and the WARN fired
# again, so the real active-event count is above 6000 too. This is now purely a runaway
# backstop — the [scan.activity_floor] below is what actually decides how much is tracked.
# Watch the WARN: if it still fires, this number is again below the live event count.
max_events = 20000
# NegRisk events with more outcomes than this are skipped: every extra outcome is
# another leg of capital and another leg of fill risk.
max_negrisk_outcomes = 30

# Report NegRisk sweeps that cover only part of an event's outcome set.
#
# Discovery drops markets that are closed, inactive, order-book-disabled or unparseable,
# so an event's tracked markets can be a subset of its real outcomes. Sweeping that
# subset is NOT risk-free: a dropped outcome can win and pay every leg nothing. With this
# off (the default) such sweeps are suppressed entirely. With it on, the YES-side is
# surfaced as "relative-value" carrying a partial_coverage flag and is never labelled
# true-arb; the NO-side stays suppressed either way, because its $(N-1) payout is only
# valid for a complete sweep.
report_partial_negrisk = false
# Smallest share count worth reporting (Polymarket's own minimum order is ~5 shares).
min_size_shares = 5
# Binary-search resolution of the depth walker, in shares.
size_search_tolerance = 0.01
# Report gaps that die as a taker but survive as a maker (fee-free, rebate-subsidised,
# but subject to legging risk).
report_maker_only = true
# Empty = scan every category.
include_categories = []

# Minimum net profit per share required to report / size an opportunity, per category.
#
# Each entry is a table: `taker` is required, `maker` is optional and defaults to `taker`.
# The two sides are floored separately because their costs differ — a taker pays
# rate * p * (1 - p) on every leg, a maker pays nothing at all.
#
#   default      the fallback for every category without its own entry.
#   geopolitics  the only fee-free category, so a thinner gap still survives there.
#   crypto       the 0.07 tier. At mid prices the taker fee is ~0.035 per share-pair
#                (2 * 0.07 * 0.5 * 0.5), so any taker gap under ~0.008/share is noise
#                dressed as edge — hence the raised taker floor. The maker floor stays at
#                the default: maker capture pays no fee and is rebate-subsidised, and it
#                is the realistic path to crypto edge.
#
# NOTE (schema change): this table replaces the old flat `[scan.net_floor]` map of
# category -> number. `net_floor = 0.005` becomes `floors = { taker = 0.005 }`.
[scan.floors]
default = { taker = 0.005 }
geopolitics = { taker = 0.003 }
crypto = { taker = 0.008, maker = 0.005 }

# Activity floor — which markets are worth tracking at all.
#
# WHY: a live discovery pass kept 5940 events / 44222 markets, i.e. 88444 token
# subscriptions across ~177 WebSocket connections, with a full REST sweep of every book
# taking minutes. Most of those markets have near-zero liquidity and cannot fill a $50
# order. They are pure overhead, and the overhead is precisely what delays detection on the
# markets that can actually be traded. This filter prunes that dust.
#
# WHAT IT IS NOT: the reported figures below are used for pruning and nothing else. No
# sizing, profit, slippage or fee number is ever derived from them — that all stays
# book-depth-based (CLAUDE.md: reported volume is double-counted and was up to ~60% wash
# trading; executable liquidity comes from the order book). A reported figure is good
# enough to answer "is this market alive at all?" and for nothing beyond that.
#
# RULES:
#   * A market is kept if it passes EITHER enabled criterion (liquidity OR 24h volume).
#     Setting a criterion to 0 switches it off, so it never judges and never drops.
#   * A market carrying NONE of the fields an enabled criterion reads is KEPT. Absence of
#     data must never look like a zero — the legacy /events payload has no activity fields
#     at all.
#   * NegRisk events are judged as a WHOLE: the event is kept if any constituent outcome
#     passes, and when kept, EVERY priceable outcome is tracked regardless of its own
#     activity. Pruning individual legs of a mutually-exclusive event would manufacture the
#     partial coverage the full-coverage guard exists to catch (a sweep only pays $1 / $(N-1)
#     when it spans every outcome). An event where nothing passes is dropped whole.
#   * Binary (non-NegRisk) events filter market by market — their markets are independent.
#
# Dropped markets are counted in the discovery breakdown as `below_activity_floor=`, so the
# books still balance: markets_kept + drops == markets_seen.
[scan.activity_floor]
enabled = true
# $500 of reported CLOB liquidity. Still a dust cutoff, not a tradability test — that is
# the depth walker's job, on the real book. With risk.per_trade_cap_usd = 50, a market
# reporting under $500 is not going to fill both legs of anything worth reporting.
#
# RAISED 100 -> 500 (2026-08), from live evidence rather than taste. At $100 a discovery
# pass kept 73,450 markets / 146,900 tokens / 294 WebSocket shards (61,950 markets were
# floor-dropped, and max_events was not the binder: truncated=false at 18,079 events). A
# full REST sweep of those books took 195 s and startup opened 294 sockets at once — past
# what a home PC on a domestic connection sweeps comfortably, and the overhead lands
# exactly on the markets that can be traded. $500 targets a universe proportionate to that
# machine. An explicit value here keeps its own behaviour; only the default moved.
min_liquidity_usd = 500
# Off by default: liquidity is the cleaner signal and volume is the figure the research says
# is inflated. Raise it (e.g. 500) to rescue markets that trade in bursts without leaving
# resting depth behind.
min_volume24h_usd = 0

[risk]
# Hard per-opportunity capital cap in USDC, applied inside the depth walker.
per_trade_cap_usd = 50

# ---------------------------------------------------------------------------------
# M3 — `polyarb run` dry-run daemon
# ---------------------------------------------------------------------------------

[daemon]
# Books are re-fetched and re-scanned this often.
scan_interval_secs = 5
# The market universe (Gamma /events) is refreshed on a much slower cadence.
#
# KNOWN LIMITATION: fast-cycling crypto series (BTC/ETH Up-or-Down 5m and 15m) are created
# and resolved well inside this interval, so most of them never enter the scanned universe
# at all. Lowering this value does not fix it — those series need a dedicated fast poller,
# which is the crypto-engine milestone. The daemon logs one WARN per refresh counting the
# short-lived crypto events it can see closing before the next one.
universe_refresh_secs = 600
# UTC time-of-day at which the daily summary is generated, stored and alerted.
daily_summary_utc = "23:55"
# Progress watchdog: seconds of NO loop progress at all before the daemon logs its last
# known position at ERROR and exits with code 75, so Docker's restart policy revives a
# clean process. 0 disables it.
#
# "Progress" is any finished unit of work — a discovery pass, a book batch, a detection
# pass — not a completed tick, so a slow-but-working loop never trips it: a full REST sweep
# of the live universe takes ~195 s and reports progress on every one of its ~1,500
# batches. The watchdog is also unarmed until the first unit of work completes, so the long
# first discovery-and-seed at startup can never be mistaken for a wedge.
#
# WHY IT EXISTS: during a DNS outage the loop stretched to many minutes, the dashboard
# showed "daemon stopped reporting", the Docker healthcheck went unhealthy — and nothing
# restarted anything. Two hours of silent degradation followed. The heartbeat (below) makes
# the page honest about a slow loop; this ends a stuck one.
watchdog_stall_secs = 600

[lifecycle]
# After detection an opportunity's legs are re-polled on this cadence, for this long,
# to measure how long it actually persisted and whether the walked fills survived.
repoll_interval_secs = 2
repoll_window_secs = 30
# Cap on simultaneously tracked opportunities; the excess is recorded as "untracked"
# rather than quietly biasing the persistence statistics.
max_concurrent = 32

# ---------------------------------------------------------------------------------
# M6 — streaming market data (CLOB WebSocket market channel)
# ---------------------------------------------------------------------------------
#
# With the stream on, detection is event-driven: books are maintained locally from pushed
# frames and only the events whose books moved are re-evaluated, which takes detection
# latency from the scan interval (seconds) down to tens of milliseconds.
#
# REST does not go away. It seeds the books at startup, re-fetches anything stale, sweeps
# the whole universe on `resync_interval_secs` as the integrity net (and runs a full
# detection pass while it is there), and takes over completely if the socket cannot be
# reached. Set `enabled = false` for the pure-REST M3 daemon.
#
# TODO(verify-live): every wire detail of this channel is unverified from the build
# container — the URL below, the subscribe frame shape, the `book`/`price_change` event
# names and their fields, and whether a connection has a subscription limit at all. See
# the TODO(verify-live) markers in src/ws.rs before the first live run.
[stream]
enabled = true
url = "wss://ws-subscriptions-clob.polymarket.com/ws/market"
# Token subscriptions per connection; the universe is sharded across as many connections
# as this implies. A conservative guess — the real limit is unverified.
max_subs_per_connection = 500
# Quiet period after the last book update before the dirty events are re-evaluated. Small
# enough to stay in the tens of milliseconds, large enough that a burst across an event's
# legs is one detection pass and not one per leg. Must be well under
# daemon.scan_interval_secs, or streaming detects no faster than polling.
debounce_ms = 50
# Rate limit on the targeted stale-book resync: one token is re-requested at most once per
# this window.
#
# NOT an idle timeout. Silence on a healthy, connected shard means the market is quiet —
# the normal state of most of 16 000 books — and treating that as staleness made this path
# re-fetch 16 500 books every ~90 s, i.e. heavier than the 5 s polling loop it replaced.
# Only a book that is explicitly invalidated (reconnect, out-of-order delta, contradictory
# hash) or whose shard dropped after its last update is resynced here. The full REST sweep
# below, not this, is the global integrity net.
#
# This window applies to the two cases that must be rate-limited: a token the API has no
# order book for (it will never arrive), and a book that is only suspect because its shard
# had a gap. A book we hold and have explicitly invalidated is repaired far sooner — on a
# fixed 15 s floor in src/ws.rs, because a reconnect must not wait out 15 minutes.
stale_after_secs = 900
# Cadence of the full REST sweep: re-fetch every book, cross-check a random sample against
# the locally streamed state (the divergence count is logged — watch it during the soak),
# adopt the REST view, and run detection over the whole universe.
resync_interval_secs = 300
# Consecutive failed connection attempts before streaming hands detection back to REST
# polling (logged at ERROR).
#
# The streak alone is not enough: the daemon only hands over when REST demonstrably worked
# *during* that same streak. Both transports failing at once is a network outage, not a
# broken socket — a live run lost its network for ~60 s and the old one-way switch disabled
# streaming for the rest of the night. That case now retries both, indefinitely.
fallback_after_failures = 5
# After a hand-over, how often to open one throwaway connection to see whether the endpoint
# answers again. On success the pool restarts and streaming resumes (logged loudly), so the
# fallback is "until proven working again" rather than permanent.
reprobe_interval_secs = 3600

# ---------------------------------------------------------------------------------
# M8 — the maker-fill simulator
# ---------------------------------------------------------------------------------
#
# Turns the daily summary's hypothetical maker P&L ("if every resting leg is crossed")
# into a defensible LOWER bound. When a maker-only opportunity is detected, the simulator
# records the resting buy orders it implies — one per leg, at the best bid the maker
# economics were computed from — and assumes we are LAST in that queue: behind the entire
# size visible at that price. A leg fills only once subsequent SELL trade prints at or
# through our price total the whole visible queue plus our own size. Cancels ahead of us
# are never credited (we cannot see them in public data), and a book improving past our
# level without prints is not a fill.
#
# NOTHING IS PLACED. This is arithmetic over trade prints that arrive whether we are here
# or not; the binary still has no wallet, no key and no order path.
[maker_sim]
enabled = true
# How long a phantom order rests before its window closes and the verdict is written
# (maker_filled / maker_partial / maker_unfilled), never to be revised. An hour is long
# enough for a slow politics book to trade through and short enough that the verdict lands
# in the day it belongs to. It is not a claim about how long we would really leave a live
# quote out — we would re-price far sooner, which is one more reason this is a floor.
window_secs = 3600
# Simultaneously tracked simulations. At the cap the OLDEST is evicted and recorded
# `maker_untracked` — a missing measurement, deliberately not counted as a non-fill.
max_concurrent = 200

[alerts]
enabled = true
# Minimum net profit per share before an opportunity is alerted (maker net is used for
# maker-only constructions). Everything detected is still written to the event log.
# Overridable per category — see [alerts.alert_min_net_by_category] below.
alert_min_net_per_share = 0.01
# Anti-spam spacing between opportunity alerts; daily summaries ignore it.
min_seconds_between_alerts = 30
# Re-alert cooldown per (event, kind, side).
#
# A slow-moving opportunity is re-detected on every sweep, and a one-tick ask move
# (6.32 -> 6.33 -> 6.34) really is different economics, so it correctly gets its own
# measurement row — but it is not news, and a live run sent the same event once per sweep
# all night. Inside this window the same construction is not alerted again unless it
# improved by at least realert_improvement per share on the taker or the maker side,
# measured against the figure last *alerted* (so a slow cumulative drift does eventually
# reach the phone). Suppressed alerts are still written to events.jsonl with
# delivery = "cooldown"; set 0 to disable the cooldown entirely.
per_event_cooldown_secs = 1800
realert_improvement = 0.01
# Consecutive Telegram failures before the circuit breaker opens, and how long it stays
# open before one alert is let through as a re-probe.
failure_circuit_break = 3
circuit_reprobe_secs = 900
telegram_api_base = "https://api.telegram.org"
request_timeout_secs = 10

# Per-category alert thresholds, overriding alert_min_net_per_share. One global number
# cannot serve a busy politics flow and a rare, high-fee crypto one at the same time: tuned
# for politics it hides crypto entirely, tuned for crypto it floods the chat.
#
# Crypto sits at 0.008 — the same number as its taker floor — so a crypto gap that already
# survived the 0.07 fee tier always reaches the phone. Volume stays bounded precisely
# because that floor is strict.
[alerts.alert_min_net_by_category]
crypto = 0.008

[storage]
# All three are gitignored.
database_path = "data/polyarb.sqlite"
log_dir = "logs"
report_dir = "reports"

# ---------------------------------------------------------------------------------
# M7 — `polyarb dashboard`, the read-only soak monitor
# ---------------------------------------------------------------------------------
#
# A SEPARATE PROCESS from `polyarb run`, by design. It opens the database above with
# SQLITE_OPEN_READ_ONLY (WAL allows a concurrent reader), serves GET routes only, and
# shares no memory, channel or lock with the daemon. It cannot disturb a running scan,
# and there is nothing on the page to press: the binary has no execution path, no wallet
# and no signing code, so a pause button would be a button that pauses nothing.
#
# It needs the daemon's `runtime_status` row (schema v3) to tell "the market is quiet"
# from "the scanner is blind". Start `polyarb run` against a database at least once
# before pointing the dashboard at it — the dashboard never creates or migrates one.
[dashboard]
# LOOPBACK BY DEFAULT, and think hard before changing it. The page has no authentication
# and shows a soak's whole evidence trail. Reach it over an SSH tunnel
# (`ssh -L 8080:127.0.0.1:8080 vps`) or put a reverse proxy with auth in front.
bind = "127.0.0.1:8080"
# How often the page re-fetches /api/state. The design asks for 2-5s; below 250ms the
# config is rejected, because that is a busy loop against a page whose slowest input
# (the universe refresh) moves every ten minutes.
poll_interval_ms = 3000
# The evidence window the funnel, the KPI row and the category table cover.
window_hours = 24
# Rows rendered in the opportunity feed (newest first). Not a page size: there is no
# paging, and no sorting or filtering is offered.
max_rows = 40
# Planned soak length, for the "soak day n of m" line. Day 1 is counted from the first
# scan cycle this database ever recorded, so a daemon restart does not reset it.
soak_days = 7
# Seconds without loop progress before the page reports the daemon as ALIVE BUT STALLED.
# 0 switches that break state off.
#
# This is a different question from runtime_status staleness. The daemon's heartbeat runs
# in its own task, so a fresh status row now proves only that the process is up; this
# threshold is what turns "the loop has finished nothing since T" into a takeover. Half of
# daemon.watchdog_stall_secs on purpose: the stall is visible here for ~5 minutes before
# the watchdog restarts the process, and it still sits far above the ~195 s a full REST
# sweep takes.
loop_stall_secs = 300

# Taker fee rates: fee = shares * rate * p * (1 - p). Makers pay zero.
# Verified against https://docs.polymarket.com/trading/fees (2026-07). Re-check
# periodically: these are protocol parameters and can change.
[fees]
geopolitics = 0.0
politics = 0.04
finance = 0.04
tech = 0.04
mentions = 0.04
sports = 0.05
economics = 0.05
culture = 0.05
weather = 0.05
other = 0.05
crypto = 0.07
